name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overview metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: n0an
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Atlantic/Canary
          filename: metrics-overview.svg
          output_action: none

      - name: Calendar metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: n0an
          template: classic
          base: ""
          config_timezone: Atlantic/Canary
          filename: metrics-calendar.svg
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: none

      - name: Reactions metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: n0an
          template: classic
          base: ""
          config_timezone: Atlantic/Canary
          filename: metrics-reactions.svg
          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_reactions_limit_issues: 100
          plugin_reactions_limit_discussions: 100
          plugin_reactions_limit_discussions_comments: 100
          plugin_reactions_days: 0
          plugin_reactions_display: absolute
          plugin_reactions_details: percentage
          output_action: none

      - name: Download GitHub profile trophies
        run: |
          set -e
          urls=(
            "https://github-profile-trophy.vercel.app/?username=n0an&theme=flat&no-frame=true&no-bg=true&margin-w=12&margin-h=12&row=1&column=6"
            "https://trophy.ryglcloud.net/?username=n0an&theme=flat&no-frame=true&no-bg=true&margin-w=12&margin-h=12&row=1&column=6"
            "https://gh-trophy.cdnsoft.net/?username=n0an&theme=flat&no-frame=true&no-bg=true&margin-w=12&margin-h=12&row=1&column=6"
          )

          for url in "${urls[@]}"; do
            if curl -L --fail --retry 3 --retry-delay 5 "$url" -o github-profile-trophy.svg; then
              exit 0
            fi
          done

          echo "Unable to download GitHub profile trophies from all configured sources." >&2
          exit 1

      - name: Copy generated metrics
        run: sudo mv /metrics_renders/* ./

      - name: Commit profile assets
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics-overview.svg metrics-calendar.svg metrics-reactions.svg github-profile-trophy.svg

          if git diff --cached --quiet; then
            echo "No profile asset changes to commit."
            exit 0
          fi

          git commit -m "Update profile assets - [Skip GitHub Action]"
          git push
