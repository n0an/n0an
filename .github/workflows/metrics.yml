name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calendar metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: n0an
          template: classic
          base: ""
          config_timezone: Atlantic/Canary
          filename: metrics-calendar.svg
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: none

      - name: Copy generated metrics
        run: sudo mv /metrics_renders/* ./

      - name: Commit profile assets
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics-calendar.svg

          if git diff --cached --quiet; then
            echo "No profile asset changes to commit."
            exit 0
          fi

          git commit -m "Update profile assets - [Skip GitHub Action]"
          git push
